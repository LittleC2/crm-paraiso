name: Verificar

# Todo push e todo pull request roda lint, testes e build.
# A publicação não é feita aqui: a Vercel publica sozinha quando há push na main
# (migrations incluídas, ver scripts/vercel-build.mjs).

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Valores falsos: só para o build e os testes não reclamarem de variável ausente.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
